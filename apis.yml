aid: jupiter-endovascular
name: Jupiter Endovascular
description: 'Jupiter Endovascular, Inc. is a privately held medical technology company
  headquartered in Menlo Park, California, developing Endoportal Control, a platform
  technology that fixes a flexibly navigated endoportal device into a stable state
  inside the vasculature so a catheter-based intervention can be delivered with the
  precision and control of direct surgical access. Its lead product is the Vertex
  Pulmonary Embolectomy System for acute pulmonary embolism, evaluated in the SPIRARE
  I first-in-human study (NCT06571760) and the FDA-approved SPIRARE II U.S. pivotal
  study. The company exited stealth with $21M and later closed an oversubscribed
  Series B surpassing its $40M target, led by Sonder Capital. Jupiter Endovascular
  is a pre-commercial clinical-stage device manufacturer and publishes no developer
  program, no API, and no machine-readable interface of any kind.'
